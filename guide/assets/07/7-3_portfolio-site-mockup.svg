<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#0c0d12" rx="16"/>
  <text x="320" y="30" text-anchor="middle" fill="#eef0f4" font-size="15" font-weight="700">개인 포트폴리오 웹사이트 레이아웃 예시</text>

  <!-- hero image -->
  <rect x="40" y="50" width="560" height="140" rx="10" fill="#1c1f2b" stroke="#5eb0ef" stroke-width="2"/>
  <text x="320" y="115" text-anchor="middle" fill="#5eb0ef" font-size="13" font-weight="700">대표 사진 (Hero)</text>
  <text x="320" y="135" text-anchor="middle" fill="#5a6272" font-size="11">가장 강렬한 한 장을 크게 배치</text>

  <!-- grid thumbnails -->
  <g>
    <rect x="40" y="205" width="176" height="90" rx="8" fill="#1c1f2b" stroke="#3a3d4a" stroke-width="2"/>
    <rect x="232" y="205" width="176" height="90" rx="8" fill="#1c1f2b" stroke="#3a3d4a" stroke-width="2"/>
    <rect x="424" y="205" width="176" height="90" rx="8" fill="#1c1f2b" stroke="#3a3d4a" stroke-width="2"/>
    <text x="320" y="255" text-anchor="middle" fill="#5a6272" font-size="11">클로즈업 · 넓은 샷 · 클로즈업 리듬 배치</text>
  </g>

  <!-- about / artist statement -->
  <rect x="40" y="315" width="560" height="75" rx="10" fill="#22283a" stroke="#f2c14e" stroke-width="2"/>
  <text x="320" y="345" text-anchor="middle" fill="#f2c14e" font-size="13" font-weight="700">소개 / 작가 노트(Artist Statement)</text>
  <text x="320" y="368" text-anchor="middle" fill="#9aa3b2" font-size="11">무엇을, 왜 찍는지 짧은 문단으로 설명</text>
</svg>
