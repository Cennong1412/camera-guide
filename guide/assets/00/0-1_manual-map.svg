<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="820" height="300" fill="#0c0d12" rx="16"/>
  <text x="410" y="30" text-anchor="middle" fill="#eef0f4" font-size="16" font-weight="700">매뉴얼 전체 지도</text>

  <!-- 0 -->
  <rect x="30" y="60" width="90" height="70" rx="10" fill="#1c1f2b" stroke="#9aa3b2" stroke-width="2"/>
  <text x="75" y="90" text-anchor="middle" fill="#9aa3b2" font-size="13" font-weight="700">0부</text>
  <text x="75" y="110" text-anchor="middle" fill="#c7ccd6" font-size="10">들어가며</text>

  <!-- 1-3: universal principles -->
  <rect x="150" y="60" width="230" height="70" rx="10" fill="#22283a" stroke="#5eb0ef" stroke-width="2"/>
  <text x="265" y="85" text-anchor="middle" fill="#5eb0ef" font-size="13" font-weight="700">1~3부 — 보편 원리</text>
  <text x="265" y="105" text-anchor="middle" fill="#c7ccd6" font-size="10">노출 · 구도 · 빛</text>
  <text x="265" y="120" text-anchor="middle" fill="#7c8698" font-size="9">어떤 카메라를 쓰든 통하는 기초</text>

  <!-- 4: smartphone practice -->
  <rect x="410" y="60" width="150" height="70" rx="10" fill="#22283a" stroke="#f2c14e" stroke-width="2"/>
  <text x="485" y="85" text-anchor="middle" fill="#f2c14e" font-size="13" font-weight="700">4부</text>
  <text x="485" y="105" text-anchor="middle" fill="#c7ccd6" font-size="10">스마트폰 실전</text>
  <text x="485" y="120" text-anchor="middle" fill="#7c8698" font-size="9">기기별 조작법</text>

  <!-- 5: genre application -->
  <rect x="590" y="60" width="200" height="70" rx="10" fill="#22283a" stroke="#e8735c" stroke-width="2"/>
  <text x="690" y="85" text-anchor="middle" fill="#e8735c" font-size="13" font-weight="700">5부</text>
  <text x="690" y="105" text-anchor="middle" fill="#c7ccd6" font-size="10">장르별 촬영 가이드</text>
  <text x="690" y="120" text-anchor="middle" fill="#7c8698" font-size="9">인물·풍경·음식 등 대상별 응용</text>

  <!-- 6,7,8 -->
  <rect x="150" y="180" width="180" height="80" rx="10" fill="#22283a" stroke="#8bd3a0" stroke-width="2"/>
  <text x="240" y="205" text-anchor="middle" fill="#8bd3a0" font-size="13" font-weight="700">6부</text>
  <text x="240" y="225" text-anchor="middle" fill="#c7ccd6" font-size="10">후반작업(보정)</text>

  <rect x="350" y="180" width="180" height="80" rx="10" fill="#22283a" stroke="#c58af0" stroke-width="2"/>
  <text x="440" y="205" text-anchor="middle" fill="#c58af0" font-size="13" font-weight="700">7부</text>
  <text x="440" y="225" text-anchor="middle" fill="#c7ccd6" font-size="10">나만의 스타일 만들기</text>

  <rect x="550" y="180" width="200" height="80" rx="10" fill="#22283a" stroke="#7fd4d4" stroke-width="2"/>
  <text x="650" y="205" text-anchor="middle" fill="#7fd4d4" font-size="13" font-weight="700">8부</text>
  <text x="650" y="225" text-anchor="middle" fill="#c7ccd6" font-size="10">연습과 성장</text>
  <text x="650" y="245" text-anchor="middle" fill="#7c8698" font-size="9">전체를 굴러가게 하는 엔진</text>

  <!-- arrows -->
  <g stroke="#4a5164" stroke-width="2" fill="none" marker-end="url(#arrow0)">
    <path d="M 120 95 L 150 95"/>
    <path d="M 380 95 L 410 95"/>
    <path d="M 560 95 L 590 95"/>
    <path d="M 690 130 L 690 155 L 240 155 L 240 180"/>
    <path d="M 330 220 L 350 220"/>
    <path d="M 530 220 L 550 220"/>
  </g>
  <defs>
    <marker id="arrow0" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a5164"/>
    </marker>
  </defs>

  <text x="410" y="285" text-anchor="middle" fill="#9aa3b2" font-size="11">기초 원리 → 도구 실전 → 대상별 응용 → 보정·스타일·꾸준한 성장</text>
</svg>
