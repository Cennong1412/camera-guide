<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#0c0d12" rx="16"/>
  <text x="320" y="30" text-anchor="middle" fill="#eef0f4" font-size="15" font-weight="700">Snapseed 공통 조작법 (도구 화면 진입 후)</text>

  <!-- phone frame -->
  <rect x="220" y="55" width="200" height="280" rx="18" fill="#1c1f2b" stroke="#3a3d4a" stroke-width="2"/>
  <text x="320" y="95" text-anchor="middle" fill="#9aa3b2" font-size="12">선택된 항목</text>
  <text x="320" y="122" text-anchor="middle" fill="#5eb0ef" font-size="18" font-weight="700">밝기</text>
  <text x="320" y="146" text-anchor="middle" fill="#f2c14e" font-size="14">+15</text>

  <!-- checkmark / X -->
  <circle cx="255" cy="305" r="18" fill="none" stroke="#e8735c" stroke-width="2"/>
  <path d="M 247 305 L 263 305 M 255 297 L 255 313" stroke="#e8735c" stroke-width="2" transform="rotate(45 255 305)"/>
  <circle cx="385" cy="305" r="18" fill="none" stroke="#8bd3a0" stroke-width="2"/>
  <path d="M 377 305 L 385 313 L 395 297" stroke="#8bd3a0" stroke-width="2" fill="none"/>

  <!-- up/down arrows left side -->
  <g stroke="#7fd4d4" stroke-width="2" fill="none">
    <path d="M 320 180 L 320 220 M 312 190 L 320 180 L 328 190" />
    <path d="M 320 260 L 320 220" />
    <path d="M 312 250 L 320 260 L 328 250" />
  </g>

  <!-- left/right arrows explanation, drawn as callouts -->
  <g font-size="12" fill="#9aa3b2">
    <text x="70" y="190" text-anchor="start">위 · 아래로 스와이프</text>
    <text x="70" y="208" text-anchor="start">→ 조정 항목 전환</text>
    <text x="70" y="226" text-anchor="start">(밝기 → 대비 → 채도 …)</text>
  </g>
  <path d="M 190 195 L 245 195" stroke="#7fd4d4" stroke-width="1.5" fill="none" marker-end="url(#arrow1)"/>

  <g font-size="12" fill="#9aa3b2">
    <text x="450" y="235" text-anchor="start">좌 · 우로 스와이프</text>
    <text x="450" y="253" text-anchor="start">→ 선택한 항목 값 조정</text>
  </g>
  <path d="M 448 230 L 400 220" stroke="#f2c14e" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <g stroke="#f2c14e" stroke-width="2" fill="none">
    <path d="M 260 220 L 380 220" />
    <path d="M 270 212 L 260 220 L 270 228" />
    <path d="M 370 212 L 380 220 L 370 228" />
  </g>

  <g font-size="12" fill="#9aa3b2">
    <text x="60" y="320" text-anchor="start">X : 취소</text>
    <text x="410" y="320" text-anchor="start">✓ : 적용</text>
  </g>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7fd4d4"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f2c14e"/></marker>
  </defs>
</svg>
