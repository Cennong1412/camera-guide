<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#0c0d12" rx="16"/>
  <text x="320" y="30" text-anchor="middle" fill="#eef0f4" font-size="15" font-weight="700">Light / Color 패널 예시 (일반적인 구성, 특정 앱의 실제 화면 아님)</text>

  <!-- Light panel -->
  <text x="60" y="65" fill="#5eb0ef" font-size="14" font-weight="700">Light</text>
  <g font-size="12" fill="#c7ccd6">
    <text x="60" y="95">노출</text>
    <rect x="150" y="85" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="390" cy="88" r="9" fill="#5eb0ef"/>

    <text x="60" y="125">대비</text>
    <rect x="150" y="115" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="330" cy="118" r="9" fill="#5eb0ef"/>

    <text x="60" y="155">하이라이트</text>
    <rect x="150" y="145" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="250" cy="148" r="9" fill="#5eb0ef"/>

    <text x="60" y="185">섀도우</text>
    <rect x="150" y="175" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="420" cy="178" r="9" fill="#5eb0ef"/>
  </g>

  <!-- Color panel -->
  <text x="60" y="235" fill="#f2c14e" font-size="14" font-weight="700">Color</text>
  <g font-size="12" fill="#c7ccd6">
    <text x="60" y="265">색온도</text>
    <rect x="150" y="255" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="300" cy="258" r="9" fill="#f2c14e"/>

    <text x="60" y="295">색조</text>
    <rect x="150" y="285" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="360" cy="288" r="9" fill="#f2c14e"/>

    <text x="60" y="325">채도</text>
    <rect x="150" y="315" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="310" cy="318" r="9" fill="#f2c14e"/>

    <text x="60" y="355">활기</text>
    <rect x="150" y="345" width="420" height="6" rx="3" fill="#2a2e3a"/>
    <circle cx="400" cy="348" r="9" fill="#f2c14e"/>
  </g>

  <text x="320" y="395" text-anchor="middle" fill="#7c8698" font-size="12">각 슬라이더를 좌우로 움직여 밝기와 색을 세밀하게 조정합니다</text>
</svg>
