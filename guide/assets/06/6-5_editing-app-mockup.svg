      <text x="360" y="290" text-anchor="middle" fill="#e8735c">디테일</text>
      <text x="360" y="330" text-anchor="middle" fill="#9aa3b2" font-size="10">Details</text>
    </g>
    <g>
      <circle cx="450" cy="285" r="30" fill="#22283a" stroke="#c58af0" stroke-width="2"/>
      <text x="450" y="290" text-anchor="middle" fill="#c58af0">흑백</text>
      <text x="450" y="330" text-anchor="middle" fill="#9aa3b2" font-size="10">B&amp;W</text>
    </g>
    <g>
      <circle cx="540" cy="285" r="30" fill="#22283a" stroke="#7fd4d4" stroke-width="2"/>
      <text x="540" y="290" text-anchor="middle" fill="#7fd4d4">복구</text>
      <text x="540" y="330" text-anchor="middle" fill="#9aa3b2" font-size="10">Healing</text>
