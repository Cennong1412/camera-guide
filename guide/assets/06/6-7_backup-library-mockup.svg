<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#0c0d12" rx="16"/>
  <text x="320" y="28" text-anchor="middle" fill="#eef0f4" font-size="15" font-weight="700">클라우드 백업 &amp; 사진 라이브러리 예시 (일반적인 구성 예시)</text>

  <!-- backup toggle card -->
  <g>
    <rect x="40" y="55" width="260" height="280" rx="14" fill="#17181f" stroke="#3a3d4a" stroke-width="2"/>
    <text x="170" y="90" text-anchor="middle" fill="#c7ccd6" font-size="13" font-weight="700">클라우드 백업</text>

    <text x="60" y="130" fill="#c7ccd6" font-size="12">자동 백업</text>
    <rect x="230" y="118" width="46" height="24" rx="12" fill="#8bd3a0"/>
    <circle cx="264" cy="130" r="10" fill="#0c0d12"/>

    <text x="60" y="165" fill="#c7ccd6" font-size="12">Wi-Fi에서만 백업</text>
    <rect x="230" y="153" width="46" height="24" rx="12" fill="#8bd3a0"/>
    <circle cx="264" cy="165" r="10" fill="#0c0d12"/>

    <text x="60" y="200" fill="#c7ccd6" font-size="12">원본 화질로 백업</text>
    <rect x="230" y="188" width="46" height="24" rx="12" fill="#3a3d4a"/>
    <circle cx="242" cy="200" r="10" fill="#7c8698"/>

    <line x1="60" y1="230" x2="280" y2="230" stroke="#2a2e3a" stroke-width="1"/>
    <text x="60" y="260" fill="#9aa3b2" font-size="11">사용 중: 12.4GB / 15GB</text>
    <rect x="60" y="270" width="220" height="8" rx="4" fill="#2a2e3a"/>
    <rect x="60" y="270" width="180" height="8" rx="4" fill="#5eb0ef"/>
  </g>

  <!-- library grid card -->
  <g>
    <rect x="330" y="55" width="270" height="280" rx="14" fill="#17181f" stroke="#3a3d4a" stroke-width="2"/>
    <text x="465" y="90" text-anchor="middle" fill="#c7ccd6" font-size="13" font-weight="700">앨범별 정리</text>

    <g fill="#22283a" stroke="#3a3d4a" stroke-width="1.5">
      <rect x="350" y="105" width="72" height="72" rx="6"/>
      <rect x="430" y="105" width="72" height="72" rx="6"/>
      <rect x="510" y="105" width="72" height="72" rx="6"/>
      <rect x="350" y="185" width="72" height="72" rx="6"/>
      <rect x="430" y="185" width="72" height="72" rx="6"/>
      <rect x="510" y="185" width="72" height="72" rx="6"/>
    </g>
    <text x="386" y="290" text-anchor="middle" fill="#7c8698" font-size="10">여행</text>
    <text x="466" y="290" text-anchor="middle" fill="#7c8698" font-size="10">인물</text>
    <text x="546" y="290" text-anchor="middle" fill="#7c8698" font-size="10">풍경</text>
    <text x="386" y="150" text-anchor="middle" fill="#5a6272" font-size="20">▲</text>
    <text x="466" y="150" text-anchor="middle" fill="#5a6272" font-size="20">◐</text>
    <text x="546" y="150" text-anchor="middle" fill="#5a6272" font-size="20">◆</text>
  </g>
</svg>
